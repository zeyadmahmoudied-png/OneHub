services:
  postgres:
    image: postgres:16-alpine
    container_name: onehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onehub
      POSTGRES_PASSWORD: onehub_dev_password
      POSTGRES_DB: onehub
    ports:
      - "5432:5432"
    volumes:
      - onehub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onehub -d onehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onehub_pgdata:
