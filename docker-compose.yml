# Local development stack
#   docker compose up -d          → PostgreSQL only
#   docker compose --profile api up -d  → Postgres + API (after image is built)
# Secrets must come from env / .env — never commit real secrets.

services:
  postgres:
    image: postgres:16-alpine
    container_name: onehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: onehub
      POSTGRES_PASSWORD: onehub_dev_password
      POSTGRES_DB: onehub
    ports:
      - "5432:5432"
    volumes:
      - onehub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onehub -d onehub"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local API container. Build when ready to test containers:
  #   docker compose --profile api build api
  #   docker compose --profile api up -d
  # This does NOT publish to the internet.
  api:
    profiles: ["api"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onehub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://onehub:onehub_dev_password@postgres:5432/onehub?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-access-secret-min-32-chars!!}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret-min-32-chars!}
      JWT_REFRESH_DAYS: "7"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - "3000:3000"

volumes:
  onehub_pgdata:
