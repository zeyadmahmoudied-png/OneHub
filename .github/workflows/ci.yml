name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  JWT_ACCESS_SECRET: 'ci-access-secret-min-32-characters-long'
  JWT_REFRESH_SECRET: 'ci-refresh-secret-min-32-characters-long'
  JWT_REFRESH_DAYS: '7'

jobs:
  backend:
    name: Backend build, unit tests, DB integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onehub
          POSTGRES_PASSWORD: onehub_ci_password
          POSTGRES_DB: onehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onehub -d onehub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://onehub:onehub_ci_password@localhost:5432/onehub_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies (npm ci required)
        run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Unit tests
        run: npm test -- --coverage=false
      - name: Integration smoke
        run: node scripts/ci-smoke.mjs

  web:
    name: Web typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies (npm ci required)
        run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  sdk:
    name: SDK build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - name: Install dependencies (npm ci required)
        run: npm ci
      - run: npm run build
      - run: npm test

  android:
    name: Android modules, tests, debug & release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed Gradle Wrapper
        run: |
          set -euo pipefail
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          python3 -c "p=open('gradle/wrapper/gradle-wrapper.jar','rb').read(4); assert p==b'PK\\x03\\x04', p"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Access control JVM unit tests
        run: |
          set -euo pipefail
          ./gradlew :accesscontrol:test --no-daemon --stacktrace --info 2>&1 | tee /tmp/accesscontrol-test.log
          # Fail the step if tests failed (gradle exit already does)

      - name: Install Android SDK
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble Debug APK
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          ls -la app/build/outputs/apk/debug/

      - name: Assemble Release APK (unsigned)
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          ls -la app/build/outputs/apk/release/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: onehub-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: onehub-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload accesscontrol test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accesscontrol-test-log
          path: /tmp/accesscontrol-test.log
          if-no-files-found: ignore
