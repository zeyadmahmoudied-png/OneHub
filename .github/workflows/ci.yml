name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'
  JWT_ACCESS_SECRET: 'ci-access-secret-min-32-characters-long'
  JWT_REFRESH_SECRET: 'ci-refresh-secret-min-32-characters-long'
  JWT_REFRESH_DAYS: '7'

jobs:
  backend:
    name: Backend build, unit tests, DB integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: onehub
          POSTGRES_PASSWORD: onehub_ci_password
          POSTGRES_DB: onehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onehub -d onehub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://onehub:onehub_ci_password@localhost:5432/onehub_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Unit tests
        run: npm test -- --coverage=false
      - name: Integration smoke
        run: node scripts/ci-smoke.mjs

  web:
    name: Web typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

  sdk:
    name: SDK build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build
      - run: npm test

  android:
    name: Android assembleDebug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Gradle Wrapper files
        run: |
          set -euo pipefail
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            printf '%s\n' \
              'distributionBase=GRADLE_USER_HOME' \
              'distributionPath=wrapper/dists' \
              'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip' \
              'networkTimeout=10000' \
              'validateDistributionUrl=true' \
              'zipStoreBase=GRADLE_USER_HOME' \
              'zipStorePath=wrapper/dists' \
              > gradle/wrapper/gradle-wrapper.properties
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v8.11.1/gradle/wrapper/gradle-wrapper.jar
          fi
          if [ ! -f gradlew ]; then
            curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradlew
          fi
          if [ ! -f gradlew.bat ]; then
            curl -fsSL -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradlew.bat
          fi
          chmod +x gradlew

      - name: Install Android command-line tools and packages
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/tmp/sdk-licenses.txt || true
          # compileSdk 35 + androidx.core:1.15.0 require platform 35
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Assemble Debug APK
        id: assemble
        run: |
          set +e
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > /tmp/gradle-build.log 2>&1
          code=$?
          echo "gradle exit=$code"
          tail -n 80 /tmp/gradle-build.log
          if [ $code -eq 0 ]; then
            ls -la app/build/outputs/apk/debug/ || true
          fi
          exit $code

      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: onehub-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
